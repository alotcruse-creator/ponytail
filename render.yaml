# Render blueprint for the FastAPI backend (free tier).
# In Render: New > Blueprint, point it at this repo. Free web services sleep
# after ~15 min idle, so the first morning request cold-starts (~30-50s).
# ponytail: no database block — Phase 1 data self-seeds on startup, so SQLite
# on the ephemeral disk is enough. Add a Postgres service when Phase 2 needs it.
services:
  - type: web
    name: fx-copilot-backend
    runtime: python
    rootDir: fx-treasury-copilot/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Set either (or both) in the Render dashboard for live AI briefs.
      # Leave unset and the app returns deterministic summaries.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # Next.js frontend, same repo, its own subfolder. next start honours $PORT.
  - type: web
    name: fx-copilot-frontend
    runtime: node
    rootDir: fx-treasury-copilot/frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      # Point the UI at the backend service above. Replace with your backend
      # URL if it differs.
      - key: NEXT_PUBLIC_API_URL
        value: https://fx-pf1g.onrender.com
