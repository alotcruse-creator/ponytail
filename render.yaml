services:
  - type: web
    name: fx-copilot-backend
    runtime: python
    rootDir: fx-treasury-copilot/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Login gate. Set all three in the Render dashboard to require sign-in.
      # Leave unset and the API stays open. Never commit real values.
      - key: AUTH_EMAIL
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
